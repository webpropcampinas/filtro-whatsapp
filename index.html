<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E19 — Seleção de Imóveis</title>
  <meta name="theme-color" content="#F8D210">
  <link rel="icon" type="image/jpeg" href="Favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { gold: '#F8D210', tech: '#B2B2B2', milk: '#F9F9F9', ink: '#1A1A1A' },
        fontFamily: { display: ['"Space Grotesk"', 'sans-serif'], sans: ['"DM Sans"', 'sans-serif'] }
      } }
    }
  </script>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .field { width:100%; background:#fff; border:1px solid #B2B2B2; border-radius:.75rem; padding:.75rem 1rem; font-size:.875rem; color:#1A1A1A; outline:none; transition:border-color .15s, box-shadow .15s; }
    .field:focus { border-color:#F8D210; box-shadow:0 0 0 3px rgba(248,210,16,.35); }
    .lbl { display:block; font-family:'Space Grotesk',sans-serif; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#1A1A1A; margin-bottom:.4rem; }
  </style>
</head>
<body class="bg-milk text-ink min-h-screen flex items-center justify-center p-4">

  <main class="max-w-md w-full bg-white rounded-2xl border border-tech/50 shadow-lg p-6 md:p-8">

    <header class="mb-6 flex flex-col items-center text-center">
      <img src="e19_svg.svg" alt="E19" width="64" height="64" class="w-16 h-16 rounded-xl mb-3">
      <h1 class="font-display text-xl font-bold tracking-tight">Alinhamento de Perfil</h1>
      <div class="w-10 h-1 bg-gold rounded-full mt-3"></div>
    </header>

    <form id="formFiltro" action="https://formspree.io/f/xrpezwgo" method="POST" class="space-y-4">
      <input type="hidden" name="_subject" value="Novo perfil — E19 Seleção de Imóveis">
      <input type="hidden" name="origem" id="origem" value="">

      <div>
        <label class="lbl" for="nome">Seu nome completo</label>
        <input type="text" id="nome" name="nome" required autocomplete="name" placeholder="Ex: Maria da Silva" class="field">
      </div>

      <div>
        <label class="lbl" for="whatsapp">WhatsApp com DDD</label>
        <input type="tel" inputmode="tel" id="whatsapp" name="whatsapp" required autocomplete="tel" placeholder="(19) 99999-9999" maxlength="15" class="field">
      </div>

      <div>
        <label class="lbl" for="email">E-mail <span class="normal-case tracking-normal font-normal text-ink/50">(opcional)</span></label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="voce@email.com" class="field">
      </div>

      <div class="h-px bg-tech/40 my-2"></div>

      <div>
        <label class="lbl" for="valor_entrada">1. Valor disponível para Entrada/Sinal</label>
        <input type="text" inputmode="numeric" id="valor_entrada" name="valor_entrada" required placeholder="Ex: R$ 30.000,00" class="field">
      </div>

      <div>
        <label class="lbl" for="composicao_renda">2. Composição de Renda / Decisão</label>
        <select id="composicao_renda" name="composicao_renda" required class="field">
          <option value="" disabled selected>Selecione uma opção...</option>
          <option value="Apenas eu">Apenas eu</option>
          <option value="Com cônjuge/parceiro(a)">Com cônjuge / parceiro(a)</option>
          <option value="Com familiar">Com familiar</option>
        </select>
      </div>

      <div>
        <label class="lbl" for="pendencias">3. Alguma pendência prévia a resolver?</label>
        <select id="pendencias" name="pendencias" required class="field">
          <option value="" disabled selected>Selecione uma opção...</option>
          <option value="Nenhuma, tudo OK">Nenhuma, tudo certo</option>
          <option value="Análise / Uso do FGTS">Análise / Uso de FGTS</option>
          <option value="Aprovação prévia no banco">Aprovação prévia no banco</option>
          <option value="Venda de outro imóvel/bem">Venda de outro imóvel/bem</option>
        </select>
      </div>

      <div>
        <label class="lbl" for="prazo_mudanca">4. Prazo desejado para mudança</label>
        <select id="prazo_mudanca" name="prazo_mudanca" required class="field">
          <option value="" disabled selected>Selecione uma opção...</option>
          <option value="Imediato (Pronto para morar)">Imediato (Imóvel pronto)</option>
          <option value="Até 12 meses">Até 12 meses</option>
          <option value="Na planta (24+ meses)">Na planta (24+ meses)</option>
        </select>
      </div>

      <div class="pt-2">
        <label class="flex items-start gap-2.5 cursor-pointer text-xs text-ink/70 leading-snug">
          <input type="checkbox" name="aceite_privacidade" value="Sim" required class="mt-0.5 rounded border-tech accent-[#F8D210]">
          <span>Estou de acordo com a <a href="https://blog.e19.imb.br/politica-privacidade-e19/" target="_blank" rel="noopener" class="text-ink underline font-bold">Política de Privacidade</a> da E19.</span>
        </label>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-gold hover:brightness-95 text-ink font-display font-bold text-xs uppercase tracking-widest py-4 rounded-xl transition active:scale-[0.99] mt-2">
        Enviar e Buscar Imóveis →
      </button>
    </form>

    <section id="sucesso" class="hidden text-center py-6 space-y-4" aria-live="polite">
      <div class="w-12 h-12 bg-gold text-ink rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
      <h2 class="font-display text-lg font-bold">Respostas enviadas com sucesso!</h2>
      <p class="text-sm text-ink/70 leading-relaxed">Já estamos separando as melhores opções para o seu perfil. Enquanto preparamos seu atendimento, nos ajude deixando uma avaliação rápida:</p>
      <a href="https://g.page/r/CRLpfR04xfRkEBM/review" target="_blank" rel="noopener"
         class="inline-block w-full bg-ink hover:bg-black text-white font-display font-bold text-xs uppercase tracking-widest py-3.5 rounded-xl transition">
        ⭐ Avaliar no Google Meu Negócio
      </a>
    </section>

    <footer class="mt-6 pt-4 border-t border-tech/40 text-center">
      <a href="https://blog.e19.imb.br/politica-privacidade-e19/" target="_blank" rel="noopener" class="font-display text-[10px] uppercase tracking-widest text-ink/50 hover:underline">
        Política de Privacidade E19
      </a>
    </footer>
  </main>

  <script>
    // Máscara BRL
    const inputEntrada = document.getElementById('valor_entrada');
    inputEntrada.addEventListener('input', (e) => {
      const digits = e.target.value.replace(/\D/g, '');
      if (!digits) { e.target.value = ''; return; }
      e.target.value = (parseInt(digits, 10) / 100).toLocaleString('pt-BR', {
        style: 'currency', currency: 'BRL'
      }).replace(/\u00a0/g, ' ');
    });

    // Máscara de telefone (DDD + 8/9 dígitos)
    document.getElementById('whatsapp').addEventListener('input', (e) => {
      let d = e.target.value.replace(/\D/g, '').slice(0, 11);
      if (d.length > 6) d = d.replace(/^(\d{2})(\d{4,5})(\d{4}).*/, '($1) $2-$3');
      else if (d.length > 2) d = d.replace(/^(\d{2})(\d+)/, '($1) $2');
      else if (d.length) d = '(' + d;
      e.target.value = d;
    });

    // Origem do link (ex.: ?ref=instagram ou ?ref=campanha-outubro)
    document.getElementById('origem').value =
      new URLSearchParams(location.search).get('ref') || 'direto';

    // Envio via fetch (sem recarregar)
    const form = document.getElementById('formFiltro');
    const sucesso = document.getElementById('sucesso');
    const btn = document.getElementById('btnSubmit');
    const label = btn.innerText;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      form.querySelector('[name=_subject]').value = 'Novo perfil — ' + form.nome.value.trim();
      btn.innerText = 'ENVIANDO...';
      btn.disabled = true;
      try {
        const r = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (!r.ok) throw new Error();
        form.classList.add('hidden');
        sucesso.classList.remove('hidden');
      } catch (_) {
        alert('Não foi possível enviar. Verifique sua conexão e tente novamente.');
        btn.innerText = label;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
