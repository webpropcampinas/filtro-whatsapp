<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E19 — Seleção de Imóveis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-6 md:p-8 relative">
    
    <!-- Cabeçalho com o Logotipo Oficial E19 -->
    <div class="mb-6 flex flex-col items-center justify-center text-center">
      <!-- Logo Vetorial E19 (Barra de três linhas + 19) -->
      <div class="w-16 h-16 bg-[#F8D210] rounded-xl flex items-center justify-center p-2 mb-3 shadow-sm">
        <svg viewBox="0 0 100 100" class="w-full h-full text-slate-900 fill-current">
          <!-- Três barras horizontais formando o E -->
          <rect x="18" y="28" width="22" height="7" />
          <rect x="18" y="46.5" width="22" height="7" />
          <rect x="18" y="65" width="22" height="7" />
          <!-- O número 1 -->
          <rect x="50" y="28" width="7" height="44" />
          <!-- O número 9 -->
          <path d="M 59 28 H 82 V 72 H 75 V 53 H 59 Z M 66 35 V 46 H 75 V 35 Z" />
        </svg>
      </div>
      <p class="text-xs uppercase tracking-widest text-slate-400 font-bold">Alinhamento de Perfil</p>
    </div>

    <!-- Formspree Form -->
    <form id="formFiltro" action="https://formspree.io/f/xrpezwgo" method="POST" class="space-y-4">
      
      <!-- 1. Entrada -->
      <div>
        <label class="block text-xs uppercase tracking-widest font-bold text-slate-600 mb-1.5">1. Valor disponível para Entrada/Sinal</label>
        <input type="text" id="valor_entrada" name="valor_entrada" required placeholder="Ex: R$ 30.000,00" 
               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-yellow-400 focus:ring-2 focus:ring-yellow-100 outline-none transition-all">
      </div>

      <!-- 2. Composição de Renda -->
      <div>
        <label class="block text-xs uppercase tracking-widest font-bold text-slate-600 mb-1.5">2. Composição de Renda / Decisão</label>
        <select name="composicao_renda" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-yellow-400 focus:ring-2 focus:ring-yellow-100 outline-none transition-all">
          <option value="" disabled selected>Selecione uma opção...</option>
          <option value="Apenas eu">Apenas eu</option>
          <option value="Com cônjuge/parceiro(a)">Com cônjuge / parceiro(a)</option>
          <option value="Com familiar">Com familiar</option>
        </select>
      </div>

      <!-- 3. Pendências -->
      <div>
        <label class="block text-xs uppercase tracking-widest font-bold text-slate-600 mb-1.5">3. Alguma pendência prévia a resolver?</label>
        <select name="pendencias" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-yellow-400 focus:ring-2 focus:ring-yellow-100 outline-none transition-all">
          <option value="" disabled selected>Selecione uma opção...</option>
          <option value="Nenhuma, tudo OK">Nenhuma, tudo certo</option>
          <option value="Análise / Uso do FGTS">Análise / Uso de FGTS</option>
          <option value="Aprovação prévia no banco">Aprovação prévia no banco</option>
          <option value="Venda de outro imóvel/bem">Venda de outro imóvel/bem</option>
        </select>
      </div>

      <!-- 4. Prazo de Mudança -->
      <div>
        <label class="block text-xs uppercase tracking-widest font-bold text-slate-600 mb-1.5">4. Prazo desejado para mudança</label>
        <select name="prazo_mudanca" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-yellow-400 focus:ring-2 focus:ring-yellow-100 outline-none transition-all">
          <option value="" disabled selected>Selecione uma opção...</option>
          <option value="Imediato (Pronto para morar)">Imediato (Imóvel pronto)</option>
          <option value="Até 12 meses">Até 12 meses</option>
          <option value="Na planta (24+ meses)">Na planta (24+ meses)</option>
        </select>
      </div>

      <!-- Campo LGPD / Política de Privacidade -->
      <div class="pt-2">
        <label class="flex items-start gap-2.5 cursor-pointer text-xs text-slate-500 leading-tight">
          <input type="checkbox" name="aceite_privacidade" required class="mt-0.5 rounded border-slate-300 text-slate-900 focus:ring-yellow-400">
          <span>Estou de acordo com a <a href="https://blog.e19.imb.br/politica-privacidade-e19/" target="_blank" class="text-slate-800 underline font-semibold hover:text-yellow-600">Política de Privacidade</a> da E19.</span>
        </label>
      </div>

      <!-- Botão Enviar -->
      <button type="submit" id="btnSubmit" class="w-full bg-[#F8D210] hover:bg-yellow-300 text-slate-900 font-bold text-xs uppercase tracking-widest py-4 rounded-xl shadow-md transition-all active:scale-[0.99] mt-2">
        Enviar e Buscar Imóveis →
      </button>
    </form>

    <!-- Tela de Sucesso + Botão GMN (Oculta por padrão) -->
    <div id="sucesso" class="hidden text-center py-6 space-y-4">
      <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
      <h2 class="text-lg font-bold text-slate-800">Respostas enviadas com sucesso!</h2>
      <p class="text-xs text-slate-500 leading-relaxed">Já estamos separando as melhores opções para o seu perfil. Enquanto preparamos seu atendimento, nos ajude deixando uma avaliação rápida:</p>
      
      <a href="https://g.page/r/CRLpfR04xfRkEBM/review" target="_blank" 
         class="inline-block w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs uppercase tracking-widest py-3.5 rounded-xl transition-all shadow-md">
        ⭐ Avaliar no Google Meu Negócio
      </a>
    </div>

    <!-- Rodapé -->
    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <a href="https://blog.e19.imb.br/politica-privacidade-e19/" target="_blank" class="text-[10px] uppercase tracking-widest text-slate-400 hover:underline">
        Política de Privacidade E19
      </a>
    </div>

  </div>

  <script>
    // Máscara BRL para o campo de entrada
    const inputEntrada = document.getElementById('valor_entrada');
    inputEntrada.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (!value) {
        e.target.value = '';
        return;
      }
      value = (parseInt(value, 10) / 100).toFixed(2) + '';
      value = value.replace('.', ',');
      value = value.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
      e.target.value = 'R$ ' + value;
    });

    // Envio do formulário via Fetch (Sem recarregar a tela)
    const form = document.getElementById('formFiltro');
    const sucesso = document.getElementById('sucesso');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSubmit.innerText = "ENVIANDO...";
      btnSubmit.disabled = true;

      const formData = new FormData(form);
      
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          form.classList.add('hidden');
          sucesso.classList.remove('hidden');
        } else {
          alert("Ocorreu um erro no envio. Tente novamente.");
          btnSubmit.innerText = "Enviar e Buscar Imóveis →";
          btnSubmit.disabled = false;
        }
      } catch (err) {
        alert("Erro de conexão. Verifique sua internet.");
        btnSubmit.innerText = "Enviar e Buscar Imóveis →";
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
